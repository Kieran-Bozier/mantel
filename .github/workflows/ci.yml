name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libfftw3-dev liblapack-dev libblas-dev

      - name: Build
        run: make ARCH=

 
      - name: Confirm the binaries were produced
        run: ls -l build/*.x

      - name: Install Python test dependencies
        run: pip install numpy pytest

      - name: Run reference tests
        env:
          OMP_NUM_THREADS: 1
        run: pytest test/reference -v
